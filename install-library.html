<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تثبيت مكتبتي</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#1E1B4B,#0F172A);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#fff}
  .box{text-align:center;padding:24px;width:100%;max-width:360px}
  .icon{width:120px;height:120px;border-radius:26px;box-shadow:0 12px 30px rgba(0,0,0,.45);margin-bottom:18px}
  h1{font-size:1.4rem;margin:0 0 22px}
  button{display:block;width:100%;font:inherit;font-size:1.05rem;font-weight:700;padding:14px;border-radius:14px;border:0;cursor:pointer;margin-bottom:12px}
  #install{background:#fff;color:#1E1B4B}
  #save{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}
  #msg{min-height:1.2em;font-size:.9rem;opacity:.85;margin-top:8px}
  .steps{display:none;background:rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;margin-top:18px;text-align:right;font-size:.95rem;line-height:1.9}
  .steps.show{display:block}
  .steps h2{font-size:1rem;margin:0 0 8px}
  .steps ol{margin:0;padding-right:20px}
  #inapp{display:none;background:#fff3c4;color:#4a3800;border-radius:12px;padding:12px;margin-bottom:16px;font-size:.92rem;line-height:1.8}
</style>
</head>
<body>

  const IDS_KEY = "library-webclip-ids-v1";

  function uuid(){
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = Array.from(b, x => x.toString(16).padStart(2,"0")).join("");
    return (h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)).toUpperCase();
  }
  function rhex(n){
    const b = new Uint8Array(n);
    crypto.getRandomValues(b);
    return Array.from(b, x => (x % 16).toString(16)).join("");
  }
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
  }
  function sVal(v){ return "<string>"+esc(v)+"</string>"; }
  function bVal(v){ return v ? "<true/>" : "<false/>"; }
  function iVal(v){ return "<integer>"+v+"</integer>"; }
  function dict(pairs, ind){
    const pad = "\t".repeat(ind);
    return "<dict>\n" + pairs.map(([k,v]) => pad+"\t<key>"+esc(k)+"</key>\n"+pad+"\t"+v).join("\n") + "\n"+pad+"</dict>";
  }
  function arr(items, ind){
    const pad = "\t".repeat(ind);
    return "<array>\n" + items.map(x => pad+"\t"+x).join("\n") + "\n"+pad+"</array>";
  }

  /* معرّفات ثابتة محفوظة في المتصفح، حتى يحدّث إعادة التثبيت الملف القديم بدل تكراره */
  function getIds(){
    try{
      const d = JSON.parse(localStorage.getItem(IDS_KEY) || "null");
      if(d && d.profIdent && d.profUUID && d.siteIdent && d.siteUUID) return d;
    }catch(e){}
    const ids = {
      profIdent: "com.personal.profile." + rhex(8),
      profUUID: uuid(),
      siteIdent: "com.personal.webclip.library." + rhex(8),
      siteUUID: uuid()
    };
    try{ localStorage.setItem(IDS_KEY, JSON.stringify(ids)); }catch(e){}
    return ids;
  }

  function buildXml(){
    const ids = getIds();
    const site = dict([
      ["FullScreen", bVal(true)],
      ["IgnoreManifestScope", bVal(true)],
      ["IsRemovable", bVal(true)],
      ["Label", sVal(CFG.label)],
      ["Precomposed", bVal(true)],
      ["URL", sVal(CFG.url)],
      ["Icon", "<data>" + CFG.icon.split(",")[1] + "</data>"],
      ["PayloadDescription", sVal("اختصار: " + CFG.displayName)],
      ["PayloadDisplayName", sVal(CFG.displayName)],
      ["PayloadIdentifier", sVal(ids.siteIdent)],
      ["PayloadType", sVal("com.apple.webClip.managed")],
      ["PayloadUUID", sVal(ids.siteUUID)],
      ["PayloadVersion", iVal(1)]
    ], 2);

    const profile = dict([
      ["PayloadContent", arr([site], 1)],
      ["PayloadDescription", sVal(CFG.desc)],
      ["PayloadDisplayName", sVal(CFG.displayName)],
      ["PayloadIdentifier", sVal(ids.profIdent)],
      ["PayloadOrganization", sVal(CFG.org)],
      ["PayloadRemovalDisallowed", bVal(false)],
      ["PayloadType", sVal("Configuration")],
      ["PayloadUUID", sVal(ids.profUUID)],
      ["PayloadVersion", iVal(1)]
    ], 0);

    return '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n' +
      '<plist version="1.0">\n' + profile + "\n</plist>\n";
  }

  function makeUrl(){
    const xml = buildXml();
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    if(doc.getElementsByTagName("parsererror").length) throw new Error("bad xml");
    return URL.createObjectURL(new Blob([xml], { type: "application/x-apple-aspen-config" }));
  }

  function makeDataUrl(){
    const xml = buildXml();
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    if(doc.getElementsByTagName("parsererror").length) throw new Error("bad xml");
    const bytes = new TextEncoder().encode(xml);
    let bin = "";
    for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return "data:application/x-apple-aspen-config;base64," + btoa(bin);
  }

  function msg(t){ document.getElementById("msg").textContent = t; }

  const STEPS = [
    "اضغط إغلاق في نافذة «تم تنزيل ملف التعريف».",
    "افتح الإعدادات، وستجد في الأعلى سطر «تم تنزيل ملف تعريف»، اضغط عليه.",
    "اضغط تثبيت في أعلى الشاشة، ثم أدخل رمز القفل.",
    "اضغط تثبيت مرة أخرى، ثم اضغط تم."
  ];
  let stepIdx = 0;

  function renderStep(){
    const txt = document.getElementById("stepText");
    const next = document.getElementById("nextStep");
    if(stepIdx < STEPS.length){
      txt.textContent = "الخطوة " + (stepIdx + 1) + " من " + STEPS.length + ": " + STEPS[stepIdx];
      next.style.display = "";
      next.textContent = stepIdx === STEPS.length - 1 ? "أنهيت الخطوات" : "التالي";
    }else{
      txt.textContent = "تم! ارجع إلى الشاشة الرئيسية، وستجد أيقونة مكتبتي.";
      next.style.display = "none";
    }
  }

  function showSteps(){
    stepIdx = 0;
    renderStep();
    document.getElementById("steps").classList.add("show");
  }

  document.getElementById("nextStep").addEventListener("click", () => {
    stepIdx++;
    renderStep();
  });

  /* تنبيه عند فتح الصفحة من داخل تطبيقات مثل واتساب أو فيسبوك أو إنستغرام */
  if(/WhatsApp|FBAN|FBAV|Instagram|Line\/|Snapchat|Twitter/i.test(navigator.userAgent)){
    document.getElementById("inapp").style.display = "block";
  }

  document.getElementById("install").addEventListener("click", () => {
    try{
      msg("");
      showSteps();
      window.location.href = makeDataUrl();
    }catch(e){
      msg("تعذّر إنشاء ملف التثبيت.");
    }
  });

  document.getElementById("save").addEventListener("click", () => {
    try{
      const a = document.createElement("a");
      a.href = makeUrl();
      a.download = "مكتبتي.mobileconfig";
      document.body.appendChild(a);
      a.click();
      a.remove();
      msg("تم حفظ الملف.");
      showSteps();
    }catch(e){
      msg("تعذّر حفظ الملف.");
    }
  });
})();
</script>
</body>
</html>
