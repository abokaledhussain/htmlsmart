<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتبتي</title>
<link rel="stylesheet" href="css/style.css?v=1.8">
</head>
<body>
<header class="toolbar">
  <div class="bar">
    <div class="bar-start">
      <button class="icon-btn" id="btnCols" aria-label="عدد الأعمدة">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="16" rx="1.5"/><rect x="16" y="4" width="5" height="16" rx="1.5"/></svg>
      </button>
      <button class="icon-btn" id="btnFull" aria-label="ملء الشاشة">
        <svg id="fullIcon" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <h1 class="title">مكتبتي</h1>
    <button class="icon-btn" id="btnMenu" aria-label="القائمة">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="بحث عن تطبيق..." autocomplete="off">
  </div>
</header>

<main id="grid" class="grid" aria-live="polite"></main>
<p id="empty" class="empty hidden">لا توجد صفحات بعد.</p>
<footer id="brandFoot" class="brand-foot hidden">
  <div class="brand-author">برمجة حسين العرياني 💫</div>
  <div class="brand-app">HTML Smart Pro</div>
</footer>

<!-- القائمة الجانبية -->
<div id="drawerBg" class="overlay hidden"></div>
<nav id="drawer" class="drawer" aria-label="القائمة الجانبية">
  <div class="drawer-head">HtmlSmart</div>
  <div class="drawer-body">
    <div class="sec">العرض</div>
    <button data-act="columns">▦ عدد الأعمدة</button>
  </div>
</nav>

<!-- نوافذ عامة -->
<div id="modalBg" class="overlay hidden"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>

<!-- عارض الصفحة -->
<section id="viewer" class="viewer hidden" aria-label="عرض الصفحة">
  <div class="viewer-bar">
    <button class="icon-btn" id="viewerBack" aria-label="رجوع">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <span id="viewerTitle" class="viewer-title"></span>
  </div>
  <iframe id="viewerFrame" class="viewer-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups" title="محتوى الصفحة"></iframe>
</section>

<input type="file" id="filePick" class="hidden" accept="image/*">
<input type="file" id="restorePick" class="hidden" accept=".json,.zip,application/json,application/zip">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/storage.js?v=1.8"></script>
<script src="js/backup.js?v=1.8"></script>
<script src="js/app.js?v=1.8"></script>
</body>
</html>
