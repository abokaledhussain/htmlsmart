<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HtmlSmart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="toolbar">
  <div class="bar">
    <div class="bar-start">
      <button class="icon-btn" id="btnFull" aria-label="ملء الشاشة">
        <svg id="fullIcon" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="btnAdd" aria-label="إضافة صفحة">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <h1 class="title">HtmlSmart</h1>
    <button class="icon-btn" id="btnMenu" aria-label="القائمة">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="بحث عن تطبيق..." autocomplete="off">
  </div>
</header>

<main id="grid" class="grid" aria-live="polite"></main>
<p id="empty" class="empty hidden">لا توجد صفحات بعد. اضغط + لإضافة صفحة.</p>
<footer id="brandFoot" class="brand-foot hidden">
  <div class="brand-author">برمجة حسين العرياني 💫</div>
  <div class="brand-app">HTML Smart Pro</div>
  <div class="brand-tech">HTML5 • JS • CSS3 يدعم</div>
</footer>

<!-- القائمة الجانبية -->
<div id="drawerBg" class="overlay hidden"></div>
<nav id="drawer" class="drawer" aria-label="القائمة الجانبية">
  <div class="drawer-head">HtmlSmart</div>
  <div class="drawer-body">
    <div class="sec">التنقل</div>
    <button data-act="home">🏠 الرئيسية</button>
    <button data-act="new">＋ إضافة صفحة جديدة</button>
    <button data-act="newFolder">📂 إنشاء مجلد جديد</button>
    <div class="sec">العرض والمظهر</div>
    <button data-act="columns">▦ عدد الأعمدة</button>
    <button data-act="settings">⚙ الإعدادات</button>
    <div class="sec">المزامنة</div>
    <button data-act="sync">🔄 المزامنة بين الأجهزة</button>
    <div class="sec">إدارة البيانات</div>
    <button data-act="backup">☁ نسخ احتياطي</button>
    <button data-act="restore">↺ استعادة نسخة احتياطية</button>
  </div>
</nav>

<!-- نوافذ عامة -->
<div id="modalBg" class="overlay hidden"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>

<!-- عارض الصفحة -->
<section id="viewer" class="viewer hidden" aria-label="عرض الصفحة">
  <div class="viewer-bar">
    <button class="icon-btn" id="viewerBack" aria-label="رجوع">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <span id="viewerTitle" class="viewer-title"></span>
    <button class="icon-btn" id="viewerEdit" aria-label="تعديل">
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
    </button>
  </div>
  <iframe id="viewerFrame" class="viewer-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups" title="محتوى الصفحة"></iframe>
</section>

<input type="file" id="filePick" class="hidden" accept="image/*">
<input type="file" id="restorePick" class="hidden" accept=".json,.zip,application/json,application/zip">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/backup.js"></script>
<script src="js/app.js"></script>
</body>
</html>
